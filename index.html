<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Deutsch mit saeed – Vokabelblatt Pro</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-96x96[1].png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16[1].png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon[1].png">
  <link rel="icon" type="image/x-icon" href="favicon[1].ico">
  <link rel="manifest" href="site[1].webmanifest">

  <!-- ✅ jsPDF & html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- ✅ Arabic font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --carbon:#0B0D0E;
      --carbon2:#0F1412;
      --ink:#EAF2EE;
      --muted:#A7B6AE;
      --moss:#2E5E3A;
      --moss2:#3E7A4B;
      --brg:#004225;
      --brg2:#0B5A36;
      --shadow: 0 4px 12px rgba(0,0,0,0.20);
      --glass1: rgba(255,255,255,0.10);
      --glass2: rgba(255,255,255,0.06);
      --wa:#25D366;
      --waDark:#0b5a46;
      --blue-grad: linear-gradient(90deg, #2563eb, #3b82f6);
      --box-h: 260px;
      --accent: #3b82f6;
      --airdrop-blue: #007AFF;
      --airdrop-green: #34C759;
      --airdrop-blue-rgb: 0, 122, 255;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; width:100%; margin:0; padding:0; }
    body{
      font-family: Arial, sans-serif;
      color:var(--ink);
      background: linear-gradient(180deg, var(--carbon), var(--carbon2));
      overflow-x:hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ===== APP WRAPPER ===== */
    #app{
      max-width: var(--app-max-w, 1100px);
      margin: 0 auto;
      padding: 16px;
      display:flex;
      flex-direction:column;
      gap:16px;
      min-height:100vh;
    }

    /* ---------- HEADER ---------- */
    .topbar{
      position: relative;
      z-index: 5;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:16px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--glass1), var(--glass2));
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter:none;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }
    .brand{ display:flex; flex-direction:column; gap:3px; flex: 1 1 200px; }
    .brandTitle{
      font-size: clamp(18px, 4vw, 22px);
      font-weight: 900;
      line-height:1.1;
      background: linear-gradient(90deg, #d7f7e6, rgba(62,122,75,0.95), rgba(0,66,37,0.95));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brandSub{ font-size: 13px; color: var(--muted); font-weight: 800; }
    .topActions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; flex: 1 1 300px; }
    .pill{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.16);
      border: 1px solid rgba(255,255,255,0.12);
      flex-wrap: wrap;
      width: 100%;
    }
    .pill input{
      padding:10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      outline:none;
      background: rgba(0,0,0,0.24);
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      flex: 1 1 120px;
      min-width: 80px;
    }

    /* ---------- STICKY CONTROLS ---------- */
    #controls{
      position: sticky;
      top: 10px;
      z-index: 100;
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      padding:16px;
      border-radius: 18px;
      justify-content:center;
      align-items: center;
      background: linear-gradient(180deg, rgba(30, 35, 33, 0.85), rgba(15, 20, 18, 0.95));
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      width: 100%;
      transition: all 0.3s ease;
    }
    .control-group{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
    .control-group label{ font-weight: 900; font-size: 14px; color: rgba(234,242,238,0.92); }
    select, input[type="range"]{
      padding:8px 12px;
      border:1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      background: rgba(0,0,0,0.3);
      color: var(--ink);
      font-weight: 900;
      outline: none;
    }

    .btn{
      border: none;
      cursor: pointer;
      padding:10px 16px;
      border-radius: 999px;
      font-weight: 900;
      transition: all .15s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      white-space:nowrap;
      color: var(--ink);
      font-size: 14px;
      position: relative;
      overflow: hidden;
    }
    .btn:active{ transform: scale(0.95); }
    .btnPrimary{
      background: linear-gradient(90deg, var(--brg), var(--moss2));
      color:#EAF2EE;
      box-shadow: 0 8px 20px rgba(0,66,37,0.35);
    }
    .btnDanger{
      background: linear-gradient(90deg, #9b2222, #b45309);
      color:#fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }
    .btnVocab{
      background: var(--blue-grad);
      color: white;
      box-shadow: 0 8px 20px rgba(37,99,235,0.4);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btnVocab:hover { box-shadow: 0 12px 30px rgba(37,99,235,0.6); transform: translateY(-1px); }

    /* ---------- GRID ---------- */
    #grid{ display:grid; gap: 16px; width: 100%; background: transparent; padding-bottom: 50px; }
    .box{
      width: 100%;
      height: var(--box-h);
      border-radius: 16px;
      position:relative;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background:
        radial-gradient(circle at 10% 0%, rgba(62,122,75,0.15), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      contain: content;
      touch-action: pan-y;
    }
    .flip-card{
      width:100%;
      height:100%;
      position:relative;
      transform-style:preserve-3d;
      transition: transform .6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    .flip-card.flipped{ transform: rotateY(180deg); }
    .flip-side{
      position:absolute;
      inset:0;
      backface-visibility:hidden;
      display:flex;
      flex-direction:column;
      padding:14px;
      gap:8px;
    }
    .flip-back{ transform: rotateY(180deg); direction: rtl; text-align:right; }
    textarea, input { font-size: 16px !important; }

    /* FRONT */
    .frontWordWrap{ flex: 1; display:flex; align-items:center; justify-content:center; min-height: 45%; position: relative; }
    .speakBtn{
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      color: var(--ink);
      z-index: 10;
    }
    .speakBtn:hover{ background: rgba(255,255,255,0.25); transform: translateY(-50%) scale(1.1); }
    .speakBtn svg{ width: 16px; height: 16px; fill: currentColor; }

    .miniSpeakBtn{
      border:none;
      cursor:pointer;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      display:flex;
      align-items:center;
      justify-content:center;
      color: rgba(234,242,238,0.92);
      transition: .2s;
    }
    .miniSpeakBtn:hover{ background: rgba(255,255,255,0.18); transform: translateY(-1px) scale(1.05); }
    .miniSpeakBtn:active{ transform: scale(0.95); }
    .miniSpeakBtn svg{ width: 14px; height: 14px; fill: currentColor; }

    .wordInput{
      width:100%;
      border:none;
      outline:none;
      resize:none;
      background:transparent;
      color: var(--ink);
      font-weight: 900;
      text-align:center;
      overflow:hidden;
      text-shadow: 0 0 15px rgba(46,94,58,0.3);
      padding-right: 40px;
    }
    .exampleWrap{
      border-top: 1px solid rgba(255,255,255,0.10);
      padding-top: 8px;
      flex: 1.2;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .exampleHeader{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .exampleLabel{ font-size:12px; color: rgba(234,242,238,0.65); font-weight:900; direction:ltr; }
    .autoBtn{
      border:none;
      cursor:pointer;
      padding:6px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 11px;
      color: #e9fff4;
      background: linear-gradient(90deg, rgba(0,66,37,0.92), rgba(62,122,75,0.92));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }
    .autoBtn:active{ transform: scale(0.95); }
    .autoMsg{ font-size: 11px; font-weight: 900; color: rgba(234,242,238,0.62); min-height: 14px; direction:ltr; text-align:left; }
    .explainInput{ border:none; outline:none; resize:none; background:transparent; color: rgba(234,242,238,0.92); line-height:1.4; flex:1; }

    /* BACK */
    .posBadge{
      display:inline-flex;
      align-self:flex-start;
      padding:4px 10px;
      border-radius:999px;
      font-size: 11px;
      font-weight: 900;
      background: rgba(62,122,75,0.2);
      border: 1px solid rgba(62,122,75,0.3);
      color: #d7f7e6;
      direction:ltr;
      cursor:pointer;
      transition: background 0.2s;
    }
    .posBadge:hover { background: rgba(62,122,75,0.4); }
    .backTopRow{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-top: 8px; flex: 1; }
    .arabicCenter{
      flex: 1.2;
      text-align:right;
      font-weight: 700;
      line-height: 1.6;
      direction: rtl;
      color: #e9fff4;
      font-family: "Amiri", Arial, sans-serif;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      overflow: hidden;
    }
    .darijaSide{
      flex: 1;
      text-align:right;
      font-weight: 700;
      line-height: 1.6;
      direction: rtl;
      color: rgba(234,242,238,0.85);
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      overflow: hidden;
    }
    .backNoteWrap{
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.10);
      display:flex;
      flex-direction:column;
      gap:6px;
      flex: 1.2;
      min-height: 0;
    }
    .noteLabel{ font-size: 12px; font-weight: 800; opacity: .90; direction: rtl; text-align: right; color: rgba(234,242,238,0.90); }
    .noteInput{
      border:none;
      outline:none;
      resize:none;
      background:transparent;
      color: rgba(234,242,238,0.92);
      line-height: 1.5;
      min-height: 30px;
      text-align:right;
      direction: rtl;
      overflow:hidden;
      font-family: "Amiri", Arial, sans-serif;
    }

    /* WhatsApp */
    #waBtn{
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 54px;
      height: 54px;
      border-radius: 999px;
      background: var(--wa);
      border: none;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(0,0,0,0.35);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 9999;
    }
    #waBtn svg{ width: 28px; height: 28px; fill: #fff; }
    #waPopup{
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      max-width: 95vw;
      border-radius: 20px;
      overflow:hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      background:#fff;
      z-index: 9999;
      display:none;
    }
    #waPopup.open{ display:block; animation: popUp 0.3s ease; }
    @keyframes popUp {
      from { transform: translate(-50%, -50%) scale(0.8) translateY(20px); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1) translateY(0); opacity: 1; }
    }
    .waHeader{ background: var(--waDark); padding: 14px; display:flex; gap:12px; align-items:center; color:#fff; }
    .waAvatar{ width: 44px; height: 44px; border-radius: 999px; object-fit: cover; border: 2px solid rgba(255,255,255,0.3); background:#0f172a; }
    .waTitle{ font-weight: 900; font-size: 15px; }
    .waSub{ font-size: 12px; opacity: .9; }
    .waClose{
      margin-left:auto;
      border:none;
      background: rgba(255,255,255,0.15);
      color:#fff;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      cursor:pointer;
      font-weight: bold;
    }
    .waBody{ padding: 16px; background: #f0f2f5; }
    .waBubble{ background:#fff; border-radius: 12px 12px 12px 2px; padding: 12px; border: 1px solid rgba(0,0,0,0.05); font-weight: 800; color:#111; font-size: 14px; }
    .waBubble small{ display:block; margin-top:6px; color:#666; }
    .waInputWrap{ margin-top: 14px; display:flex; gap:8px; }
    #waInput{ flex:1; border-radius: 20px; border: 1px solid #ccc; padding: 12px 16px; outline:none; font-weight: 800; font-size: 15px;}
    #waSend{ border:none; border-radius: 20px; padding: 0 20px; background: var(--wa); color:#fff; font-weight: 900; cursor:pointer; }

    /* PDF STAGE */
    #pdfStage{
      position: absolute;
      left: -9999px;
      top: 0;
      width: 210mm;
      height: 297mm;
      padding: 12mm;
      background: #ffffff;
      color: #111;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      z-index: -999;
    }
    .pdfHeaderArea { height: var(--header-h); width: 100%; margin-bottom: 4mm; }
    .pdfBigTitle{ margin:0; text-align:center; font-weight: 900; font-size: 18px; color:#0B5A36; line-height: 1.2; }
    .pdfMeta{ display:flex; justify-content:space-between; gap: 6mm; font-size: 11px; font-weight: 900; margin-top: 5mm; }
    .pdfMeta span{ border: 1px solid rgba(0,0,0,0.14); border-radius: 999px; padding: 2.5mm 4mm; background: rgba(0,0,0,0.02); }
    .pdfGrid{ display: grid; gap: var(--pdfGap); grid-template-columns: repeat(var(--pdfCols), var(--pdfBoxW)); grid-auto-rows: var(--pdfBoxH); width: 100%; }
    .pdfCard{ width: var(--pdfBoxW); height: var(--pdfBoxH); background: #fff; border: 1px solid rgba(0,0,0,0.25); border-radius: 14px; overflow: hidden; }
    .pdfCard.empty { border: none; background: transparent; }
    .pdfCardInner{ padding: 12px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
    .pdfWordWrap{ flex: 1; display:flex; align-items:center; justify-content:center; text-align:center; }
    .pdfWord{ font-weight: 900; font-size: 18px; white-space: pre-wrap; word-break: break-word; color: #000; }
    .pdfLine{ height: 1px; background: rgba(0,0,0,0.15); width: 100%; }
    .pdfExample{ font-size: 12px; line-height: 1.4; flex: 1; color: #222; white-space: pre-wrap; }
    .pdfAr{ direction:rtl; unicode-bidi:isolate; text-align:center; font-family:"Amiri",sans-serif; white-space:pre-wrap;}
    .pdfDar{ direction: rtl; text-align: right; font-weight: 700; font-size: 13px; line-height: 1.5; color: #333; white-space: pre-wrap; }
    .pdfNote{ direction: rtl; text-align: right; font-size: 12px; line-height: 1.4; font-family: "Amiri", Arial, sans-serif; color: #444; white-space: pre-wrap; }

    /* Loading */
    #pdfLoading {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-weight: 900;
      font-size: 20px;
      backdrop-filter: blur(5px);
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #25D366;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ✅ CREATIVE HUB (Wortschatz) */
    #vocabHub{
      position: fixed;
      inset: 0;
      background: rgba(11, 13, 14, 0.95);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }
    #vocabHub.open{ display: flex; }
    .hubPanel{
      background: linear-gradient(180deg, #1a1d1b, #0f1412);
      border-radius: 24px;
      max-width: 800px;
      width: 95%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 30px;
      box-shadow: 0 0 100px rgba(37,99,235,0.2);
      border: 1px solid rgba(255,255,255,0.1);
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .hubHeader{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .hubTitle{ font-size: 24px; font-weight: 900; color: #d7f7e6; text-transform: uppercase; letter-spacing: 1px; }
    .hubClose{ background: rgba(255,255,255,0.1); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer; transition: 0.2s; }
    .hubClose:hover{ background: rgba(255,255,255,0.2); }
    .hubGrid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .hubCard{
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hubCard:hover{
      background: rgba(37,99,235,0.15);
      border-color: var(--accent);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(37,99,235,0.2);
    }
    .hubCard::before{
      content:'';
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      background: radial-gradient(circle at center, rgba(255,255,255,0.1), transparent 70%);
      opacity: 0;
      transition: 0.3s;
    }
    .hubCard:hover::before{ opacity: 1; }
    .hubCardName{ font-weight: 900; color: #EAF2EE; font-size: 16px; margin-bottom: 5px; z-index: 1; }
    .hubCardCount{ font-size: 12px; opacity: 0.6; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 20px; z-index: 1; }

    /* ✅ Airdrop Loading Bar Animation */
    #loadBarContainer{ position: fixed; top: 0; left: 0; width: 100%; height: 6px; z-index: 10001; display: none; }
    #loadBar{
      height: 100%;
      background: linear-gradient(90deg, var(--airdrop-blue), var(--airdrop-green));
      width: 0%;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 15px var(--airdrop-blue);
    }

    /* ✅ CONFETTI CANVAS */
    #confettiCanvas{ position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10002; }

    /* Footer */
    .cleanFooter{
      margin-top:80px;
      padding:60px 0;
      border-top:1px solid rgba(255,255,255,0.08);
      display:flex;
      justify-content:center;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.25));
    }
    .cleanSocial{ display:flex; gap:60px; }
    .cleanIcon{
      width:110px;
      height:110px;
      border-radius:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, #0F1412, #0B0D0E);
      border:2px solid #2E5E3A;
      box-shadow:0 25px 70px rgba(0,0,0,0.7);
      transition:0.3s ease;
    }
    .cleanIcon svg{ width:55px; height:55px; fill:#3E7A4B; }
    .cleanIcon:hover{ transform:translateY(-8px) scale(1.05); border-color:#3E7A4B; box-shadow:0 35px 90px rgba(0,66,37,0.9); }

    /* ✅ AirDrop style */
    @keyframes airdrop-pulse-anim {
      0% { box-shadow: 0 0 0 0 rgba(var(--airdrop-blue-rgb), 0.7); transform: scale(1); }
      50% { box-shadow: 0 0 0 15px rgba(var(--airdrop-blue-rgb), 0); transform: scale(1.05); }
      100% { box-shadow: 0 0 0 0 rgba(var(--airdrop-blue-rgb), 0); transform: scale(1); }
    }
    .airdrop-pulse { animation: airdrop-pulse-anim 0.6s ease-out; border-color: var(--airdrop-blue) !important; }

    function normalizeWord(s){
      s = String(s || '').trim().toLowerCase();
      s = s.replace(/^(der|die|das|ein|eine|einen|einem|einer)\s+/i, '');
      s = s.replace(/[""„"']/g,'');
      s = s.replace(/[.,;:!?()[\]{}]/g,' ');
      s = s.replace(/\s+/g,' ').trim();
      s = s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
      s = s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      return s;
    }
    var QAMOS = Object.create(null);
    function addKey(key, entry){
      key = String(key || '').trim();
      if(!key || key.length < 2) return;
      QAMOS[key] = entry;
    }
    function generateVariants(base){
      var out = new Set();
      out.add(base);
      out.add(base.replace(/[\s-]/g,''));

      var stripped = base
        .replace(/\s+-\w+$/,'')
        .replace(/\s+-(e|en|er|n|s)$/,'')
        .replace(/(en|er|e|n|s)$/,'');

      if(stripped && stripped.length >= 3){
        out.add(stripped);
        out.add(stripped.replace(/[\s-]/g,''));
      }

      var simpleUml = base.replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');
      out.add(simpleUml);
      out.add(simpleUml.replace(/[\s-]/g,''));

      var simpleUml2 = stripped.replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');
      if(simpleUml2 && simpleUml2.length >= 3){
        out.add(simpleUml2);
        out.add(simpleUml2.replace(/[\s-]/g,''));
      }

      var schToCh = base.replace(/sch/g,'ch');
      out.add(schToCh);
      out.add(schToCh.replace(/[\s-]/g,''));

      var chToSch = base.replace(/ch/g,'sch');
      out.add(chToSch);
      out.add(chToSch.replace(/[\s-]/g,''));

      out.add(simpleUml.replace(/sch/g,'ch'));
      out.add(simpleUml.replace(/ch/g,'sch'));

      out.add(base.replace(/ss/g,'s'));
      out.add(base.replace(/ss/g,'sz'));
      return Array.from(out).filter(function(v) { return v && v.length >= 2; });
    }
    function addToQamos(entry){
      var base = normalizeWord(entry.word);
      var variants = generateVariants(base);
      for(var i = 0; i < variants.length; i++) addKey(variants[i], entry);
      addKey(base.replace(/[\s-]/g,''), entry);
    }
    
    function extractWordsFromObject(obj) {
      if (Array.isArray(obj)) {
        for (var i = 0; i < obj.length; i++) {
          if (obj[i] && obj[i].word) {
            addToQamos(obj[i]);
          }
        }
      } else if (typeof obj === 'object' && obj !== null) {
        for (var key in obj) {
          extractWordsFromObject(obj[key]);
        }
      }
    }

      for(var k in QAMOS) delete QAMOS[k];
      
      var keys = Object.keys(WORTSCHATZ_DATA);
      for(var i = 0; i < keys.length; i++){
        var list = WORTSCHATZ_DATA[keys[i]] || [];

    function levenshtein(a, b){
      a = a || ""; b = b || "";
      if (a === b) return 0;
      var al = a.length, bl = b.length;
      if (al === 0) return bl;
      if (bl === 0) return al;
      var v0 = new Array(bl + 1);
      var v1 = new Array(bl + 1);
      for (var i = 0; i <= bl; i++) v0[i] = i;
      for (var i = 0; i < al; i++){
        v1[0] = i + 1;
        var ca = a.charCodeAt(i);
        for (var j = 0; j < bl; j++){
          var cost = (ca === b.charCodeAt(j)) ? 0 : 1;
          v1[j+1] = Math.min(v1[j] + 1, v0[j+1] + 1, v0[j] + cost);
        }
        for (var j = 0; j <= bl; j++) v0[j] = v1[j];
      }
      return v1[bl];
    }

    function lookupSmart(userInput){
      var raw = String(userInput || '').trim();
      if(!raw) return null;
      var n = normalizeWord(raw);
      var variants = generateVariants(n);
      for(var vi = 0; vi < variants.length; vi++){
        if(QAMOS[variants[vi]]) return { entry: QAMOS[variants[vi]], confidence: 1 };
      }
      var seen = {};
      var candidates = [];
      for(var k in QAMOS){
        var e = QAMOS[k];
        if(e && !seen[e.word]){
          seen[e.word] = true;
          candidates.push(e);
        }
      }
      var target = variants[0].replace(/[\s-]/g,'');
      var tl = target.length;
      var maxDist = tl <= 4 ? 1 : (tl <= 7 ? 2 : 3);
      var best = null;
      var bestScore = -Infinity;

      for(var ci = 0; ci < candidates.length; ci++){
        var e = candidates[ci];
        var keyBase = normalizeWord(e.word).replace(/[\s-]/g,'');
        if(!keyBase) continue;
        var d = levenshtein(target, keyBase);
        if(d > maxDist) continue;

        var sim = 1 - (d / Math.max(1, Math.max(keyBase.length, tl)));
        var bonus = (keyBase.indexOf(target) === 0 || target.indexOf(keyBase) === 0) ? 0.12 : 0;

        var vBoost = 0;
        for(var vvi = 0; vvi < Math.min(variants.length, 6); vvi++){
          var vc = variants[vvi].replace(/[\s-]/g,'');
          var dd = levenshtein(vc, keyBase);
          var s2 = 1 - (dd / Math.max(1, Math.max(keyBase.length, vc.length)));
          if(s2 > vBoost) vBoost = s2;
        }
        var score = sim + bonus + (vBoost * 0.08);
        if(score > bestScore){ bestScore = score; best = e; }
      }
      if(!best) return null;
      var confidence = Math.max(0, Math.min(0.98, bestScore));
      if(confidence < 0.76) return null;
      return { entry: best, confidence: confidence };
    }

    function ttsRefreshVoices(){
      if(!window.speechSynthesis) return;
      TTS.voices = window.speechSynthesis.getVoices() || [];
      TTS.ready = TTS.voices.length > 0;

    function pickBestGermanVoice(){
      var voices = TTS.voices || [];
      if(!voices.length) return null;

      var scoreVoice = function(v) {
        var lang = (v.lang || '').toLowerCase();
        var name = (v.name || '').toLowerCase();
        var s = 0;
        if (lang === 'de-de') s += 50;
        else if (lang.indexOf('de') === 0) s += 40;
        if (v.localService) s += 8;
        if (name.indexOf('google') >= 0) s += 20;
        if (name.indexOf('enhanced') >= 0) s += 10;
        if (name.indexOf('premium') >= 0) s += 10;
        if (name.indexOf('neural') >= 0) s += 10;
        if (name.indexOf('anna') >= 0) s += 12;
        if (name.indexOf('helena') >= 0) s += 10;
        if (name.indexOf('markus') >= 0) s += 10;
        if (name.indexOf('compact') >= 0) s -= 2;
        if (name.indexOf('android') >= 0) s -= 2;
        return s;
      };

      var german = voices.filter(function(v) { return (v.lang||'').toLowerCase().indexOf('de') === 0; });
      if(!german.length) return null;
      german.sort(function(a,b) { return scoreVoice(b) - scoreVoice(a); });
      return german[0] || null;
    }

    function ttsPrimeOnce(){
      if(!window.speechSynthesis || TTS.primed) return;
      try{
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        u.rate = 1;
        u.pitch = 1;
        window.speechSynthesis.speak(u);
        TTS.primed = true;
      }catch(e){}
    }

    function ttsStop(){
      if(!window.speechSynthesis) return;
      try{
        window.speechSynthesis.cancel();
        if (TTS.isIOS) setTimeout(function() { try { window.speechSynthesis.cancel(); } catch(e){} }, 25);
      }catch(e){}
      TTS.speaking = false;
    }

    function cleanSpeakText(t){
      t = String(t || '').trim();
      t = t.replace(/\s+/g,' ').trim();
      return t;
    }

    function chunkTextForTTS(text, maxLen){
      maxLen = maxLen || 160;
      var t = cleanSpeakText(text);
      if(!t) return [];
      var parts = t.split(/([.!?…])\s+/).reduce(function(acc, cur) {
        if (cur === '.' || cur === '!' || cur === '?' || cur === '…') acc[acc.length-1] = (acc[acc.length-1] || '') + cur;
        else acc.push(cur);
        return acc;
      }, []).map(function(s) { return s.trim(); }).filter(Boolean);

      var out = [];
      for(var i = 0; i < parts.length; i++){
        var p = parts[i];
        if(p.length <= maxLen){ out.push(p); continue; }
        var start = 0;
        while(start < p.length){
          out.push(p.slice(start, start + maxLen));
          start += maxLen;
        }
      }
      return out.filter(Boolean);
    }

    function speakGerman(text, opts){
      opts = opts || {};
      var t = cleanSpeakText(text);
      if(!t || !window.speechSynthesis) return;

      ttsPrimeOnce();
      ttsStop();
      ttsRefreshVoices();

      var voice = pickBestGermanVoice();
      var rate = 0.96;
      var pitch = (opts.pitch != null ? opts.pitch : 1.00);
      var volume = (opts.volume != null ? opts.volume : 1.0);
      var chunks = chunkTextForTTS(t, 170);

      var i = 0;
      TTS.speaking = true;

      var speakNext = function() {
        if(i >= chunks.length){ TTS.speaking = false; return; }
        var u = new SpeechSynthesisUtterance(chunks[i]);
        u.lang = 'de-DE';
        u.rate = rate;
        u.pitch = pitch;
        u.volume = volume;
        if (voice) u.voice = voice;

        u.onend = function() { i++; setTimeout(speakNext, (opts.gapMs != null ? opts.gapMs : 120)); };
        u.onerror = function() {
          try{
            var f = new SpeechSynthesisUtterance(chunks[i]);
            f.lang='de-DE';
            f.rate=rate;
            f.pitch=pitch;
            f.volume=volume;
            f.onend = function() { i++; setTimeout(speakNext, (opts.gapMs != null ? opts.gapMs : 120)); };
            window.speechSynthesis.speak(f);
          }catch(e){ TTS.speaking = false; }
        };

        requestAnimationFrame(function() { window.speechSynthesis.speak(u); });
      };
      speakNext();
    }

    function stripParentheses(s){
      return String(s || '').replace(/\([^)]*\)/g, '').replace(/\s+/g,' ').trim();
    }

    function parseNounEntry(wordStr){
      var raw = stripParentheses(wordStr);
      raw = raw.replace(/[""„"]/g,'').trim();
      var m = raw.match(/^(der|die|das)\s+(.+)$/i);
      var article = m ? m[1].toLowerCase() : '';
      var rest = m ? m[2] : raw;
      var parts = rest.split(',');
      var base = stripParentheses(parts[0] || '').trim();
      var pluralInfo = stripParentheses((parts[1] || '')).trim();

      var plural = '';
      if (pluralInfo){
        if (/^[-–—]+$/.test(pluralInfo)) plural = '';
        else if (pluralInfo.charAt(0) === '-') {
          var suf = pluralInfo.replace(/^-+/, '').trim();
          if (suf) plural = base + suf;
        } else {
          plural = pluralInfo;
        }
      }
      return { article: article, base: base, plural: plural, isNoun: !!article };
    }

    function buildSpeakTextsFromEntry(entry){
      var w = entry && entry.word ? entry.word : '';
      var isNoun = /^(der|die|das)\s+/i.test(w.trim());
      
      if (!isNoun) {
        var s = String(w || '');
        s = s.replace(/\+\s*A\b/g, 'plus Akkusativ');
        s = s.replace(/\+\s*D\b/g, 'plus Dativ');
        s = s.replace(/\+\s*G\b/g, 'plus Genitiv');
        s = s.replace(/\+\s*N\b/g, 'plus Nominativ');
        s = s.replace(/[()]/g, ' ');
        s = s.replace(/\s+/g, ' ').trim();
        return s ? [s] : [];
      }

      var parsed = parseNounEntry(w);
      var singular = (parsed.article + ' ' + parsed.base).trim();

      var pluralText = '';
      if (parsed.plural){
        pluralText = String(parsed.plural).trim();
        if (!/^(der|die|das)\s+/i.test(pluralText)) {
          pluralText = 'die ' + pluralText;
        }
      }

      var texts = [];
      if (singular) texts.push(singular);
      if (pluralText) texts.push(pluralText);
      return texts;
    }

    function speakGermanSequence(texts, opts) {

      if (!window.speechSynthesis) return;

      var arr = (texts || []).map(function(t) { return cleanSpeakText(t); }).filter(Boolean);

      ttsPrimeOnce();
      ttsStop();
      ttsRefreshVoices();

      var voice  = pickBestGermanVoice();
      var rate   = (opts.rate != null ? opts.rate : 0.96);
      var pitch  = (opts.pitch != null ? opts.pitch : 1.0);
      var volume = (opts.volume != null ? opts.volume : 1);

      if (TTS.isIOS) {
        var joined = arr.join('. ');
        var u = new SpeechSynthesisUtterance(joined);
        u.lang = "de-DE";
        u.rate = rate;
        u.pitch = pitch;
        u.volume = volume;
        if (voice) u.voice = voice;
        try { window.speechSynthesis.resume(); } catch(e) {}
        setTimeout(function() {
          try { window.speechSynthesis.speak(u); } catch(e) {}
        }, 80);
        return;
      }

      var gapMs = (opts.gapMs != null ? opts.gapMs : 350);
      var index = 0;

      function speakNext() {
        if (index >= arr.length) return;
        var u = new SpeechSynthesisUtterance(arr[index]);
        u.lang = "de-DE";
        u.rate = rate;
        u.pitch = pitch;
        u.volume = volume;
        if (voice) u.voice = voice;
        u.onend = function() { index++; setTimeout(speakNext, gapMs); };
        u.onerror = function() { index++; setTimeout(speakNext, gapMs); };
        window.speechSynthesis.speak(u);
      }
      speakNext();
    }

    function fireConfetti() {
      var canvas = document.getElementById('confettiCanvas');
      var ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var particles = [];
      var colors = ['#007AFF', '#34C759', '#FFD60A', '#FF2D55', '#AF52DE'];
      for (var i = 0; i < 150; i++) {
        particles.push({
          x: canvas.width / 2, y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 15,
          vy: (Math.random() - 0.5) * 15,
          size: Math.random() * 8 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 100
        });
      }
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var active = false;
        for(var i = 0; i < particles.length; i++){
          var p = particles[i];
          if (p.life > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        if (active) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    document.getElementById('downloadPdfBtn').onclick = async function() {

      try{
        loader.style.display = 'flex';

        var jsPDF = window.jspdf.jsPDF;

        var canvasScale = 1.3;
        var pageW = 210;
        var pageH = 297;
        var pad = 12;
        var gap = 4;
        var innerW = pageW - (2 * pad);
        var boxMmW = (innerW - (gap * (cols - 1))) / cols;
        var boxMmH = boxMmW * 1.1;

        var pdfStage = document.getElementById('pdfStage');

        function buildPage(mode, startIndex, count, headerH){
          pdfStage.innerHTML = "";

          var headerArea = document.createElement("div");
          headerArea.className = "pdfHeaderArea";
          headerArea.style.setProperty("--header-h", headerH + "mm");

          if (mode === "front" && headerH > 0) {
            var title = document.createElement("div");
            title.className = "pdfBigTitle";

            headerArea.appendChild(title);

          }

          pdfStage.appendChild(headerArea);

          var g = document.createElement("div");
          g.className = "pdfGrid";

          pdfStage.style.setProperty("--pdfCols", String(cols));
          pdfStage.style.setProperty("--pdfBoxW", boxMmW + "mm");
          pdfStage.style.setProperty("--pdfBoxH", boxMmH + "mm");
          pdfStage.style.setProperty("--pdfGap", gap + "mm");

          var rows = Math.ceil(count / cols);
          var pageData = boxes.slice(startIndex, startIndex + count);

          for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
              var itemIndex = (mode === "front") ? (r * cols + c) : (r * cols + (cols - 1 - c));
              var card = document.createElement("div");
              card.className = "pdfCard";

              if (itemIndex >= pageData.length) {
                card.classList.add("empty");
              } else {
                var d = pageData[itemIndex] || {};
                var inner = document.createElement("div");
                inner.className = "pdfCardInner";

                if (mode === "front"){
                  inner.innerHTML = '<div class="pdfWordWrap"><div class="pdfWord">' + (d.word||"") + '</div></div><div class="pdfLine"></div><div class="pdfExample">' + (d.example||"") + '</div>';
                } else {
                  var res = lookupSmart(d.word);
                  var b1 = res ? res.entry : null;
                  var arText = d.arTextManual || (b1?b1.ar:"");

                  if(d.note) html += '<div class="pdfLine"></div><div class="pdfNote">ملاحظة: ' + d.note + '</div>';

        while (index < boxes.length) {
          var headerH = isFirstPage ? 20 : 0;
          var innerH = pageH - (2 * pad);
          var availableGridH = innerH - headerH - 4;
          var rowsPerPage = Math.max(1, Math.floor(availableGridH / (boxMmH + gap)));
          var perPage = cols * rowsPerPage;

          pdfStage.style.zIndex = "1";

          step++;
          progressFill.style.width = Math.min(100, Math.round((step / totalSteps) * 100)) + '%';

          buildPage("front", index, perPage, headerH);
          await new Promise(function(r) { setTimeout(r, 50); });
          var c1 = await html2canvas(pdfStage, { scale: canvasScale, useCORS: true, backgroundColor: "#ffffff", logging: false });
          if(!isFirstPage) pdf.addPage();
          pdf.addImage(c1.toDataURL("image/png"), "PNG", 0, 0, 210, 297);

          pdf.addPage();
          step++;
          progressFill.style.width = Math.min(100, Math.round((step / totalSteps) * 100)) + '%';

          buildPage("back", index, perPage, headerH);
          await new Promise(function(r) { setTimeout(r, 50); });
          var c2 = await html2canvas(pdfStage, { scale: canvasScale, useCORS: true, backgroundColor: "#ffffff", logging: false });
          pdf.addImage(c2.toDataURL("image/png"), "PNG", 0, 0, 210, 297);

          index += perPage;
          isFirstPage = false;
        }

        pdfStage.style.zIndex = "-999";
        progress.classList.remove('active');
        progress.style.display = 'none';

        var today = new Date().toISOString().split('T')[0];
        pdf.save("Deutsch_mit_saeed_" + today + ".pdf");

      } catch(e){
        alert("Fehler: " + e.message);
        console.error('PDF Error:', e);
      } finally {
        loader.style.display = 'none';
        progress.classList.remove('active');
        progress.style.display = 'none';
      }
    };

    // ✅ INIT - Fixed: use both DOMContentLoaded and fallback
    function initApp(){
      load();
      numBoxesInput.value = settings.numBoxes;
      numBoxesValue.textContent = settings.numBoxes;
      columnsSelect.value = settings.columns;
      boxSizeSelect.value = settings.boxSize;
      showBackCheckbox.checked = settings.showBack;
      updateGrid();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
