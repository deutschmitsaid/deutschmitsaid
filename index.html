<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>حفظ القرآن – تفسير السعدي</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">

  <style>
    :root{
      --carbon:#0B0D0E;
      --carbon2:#0F1412;
      --ink:#EAF2EE;
      --muted:#A7B6AE;
      --moss:#2E5E3A;
      --moss2:#3E7A4B;
      --brg:#004225;
      --brg2:#0B5A36;
      --shadow: 0 4px 12px rgba(0,0,0,0.20);
      --glass1: rgba(255,255,255,0.10);
      --glass2: rgba(255,255,255,0.06);
      --wa:#25D366;
      --waDark:#0b5a46;
      --blue-grad: linear-gradient(90deg, #2563eb, #3b82f6);
      --accent: #3b82f6;
      --airdrop-blue: #007AFF;
      --airdrop-green: #34C759;
      --airdrop-blue-rgb: 0, 122, 255;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; width:100%; margin:0; padding:0; }
    body{
      font-family: Arial, sans-serif;
      color:var(--ink);
      background: linear-gradient(180deg, var(--carbon), var(--carbon2));
      overflow-x:hidden;
      -webkit-text-size-adjust: 100%;
    }
    
    #app{
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      display:flex;
      flex-direction:column;
      gap:16px;
      min-height:100vh;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:16px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--glass1), var(--glass2));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }
    .brand{ display:flex; flex-direction:column; gap:3px; flex: 1 1 200px; }
    .brandTitle{
      font-size: clamp(18px, 4vw, 22px);
      font-weight: 900;
      line-height:1.1;
      background: linear-gradient(90deg, #d7f7e6, rgba(62,122,75,0.95), rgba(0,66,37,0.95));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brandSub{ font-size: 13px; color: var(--muted); font-weight: 800; }

    #controls{
      position: sticky;
      top: 10px;
      z-index: 100;
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      padding:16px;
      border-radius: 18px;
      justify-content:center;
      align-items: center;
      background: linear-gradient(180deg, rgba(30, 35, 33, 0.85), rgba(15, 20, 18, 0.95));
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      width: 100%;
    }

    .btn{
      border: none;
      cursor: pointer;
      padding:10px 16px;
      border-radius: 999px;
      font-weight: 900;
      transition: all .15s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      white-space:nowrap;
      color: var(--ink);
      font-size: 14px;
    }
    .btn:active{ transform: scale(0.95); }
    .btnVocab{
      background: var(--blue-grad);
      color: white;
      box-shadow: 0 8px 20px rgba(37,99,235,0.4);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btnVocab:hover { box-shadow: 0 12px 30px rgba(37,99,235,0.6); transform: translateY(-1px); }

    /* ===== SURAH HEADER ===== */
    .surahHeader{
      text-align:center;
      padding: 20px;
      background: radial-gradient(circle at center, rgba(62,122,75,0.15), transparent 70%);
      border-radius: 20px;
      border: 1px solid rgba(62,122,75,0.2);
    }
    .surahTitle{
      font-family: "Amiri Quran", "Amiri", serif;
      font-size: clamp(28px, 6vw, 48px);
      color: #d7f7e6;
      margin: 0 0 8px 0;
      text-shadow: 0 0 30px rgba(46,94,58,0.4);
    }
    .surahInfo{
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
    }
    .bismillah{
      font-family: "Amiri Quran", "Amiri", serif;
      font-size: clamp(22px, 4vw, 36px);
      color: #d7f7e6;
      opacity: 0.85;
      margin: 16px 0;
      text-align: center;
    }

    /* ===== VERSE GRID ===== */
    #versesGrid{
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
    }

    .verseCard{
      width: 100%;
      border-radius: 16px;
      position:relative;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background:
        radial-gradient(circle at 10% 0%, rgba(62,122,75,0.12), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      padding: 20px;
      display:flex;
      flex-direction:column;
      gap: 12px;
      transition: all 0.3s ease;
    }
    .verseCard:hover{
      border-color: rgba(62,122,75,0.4);
      box-shadow: 0 12px 30px rgba(0,66,37,0.2);
      transform: translateY(-2px);
    }
    .verseCard.memorized{
      border-color: rgba(52,199,89,0.5);
      background:
        radial-gradient(circle at 10% 0%, rgba(52,199,89,0.1), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    }
    .verseCard.memorized::after{
      content: '✓';
      position: absolute;
      top: 12px;
      left: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--airdrop-green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
    }

    .verseTopRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .verseNum{
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0,66,37,0.4);
      border: 1px solid rgba(62,122,75,0.5);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      font-size: 14px;
      color: #d7f7e6;
      flex-shrink: 0;
    }
    .verseActions{
      display:flex;
      gap:8px;
    }
    .verseActionBtn{
      border: none;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      display:flex;
      align-items:center;
      justify-content:center;
      color: var(--ink);
      transition: 0.2s;
    }
    .verseActionBtn:hover{ background: rgba(255,255,255,0.18); transform: scale(1.1); }
    .verseActionBtn svg{ width: 14px; height: 14px; fill: currentColor; }

    .arabicText{
      font-family: "Amiri Quran", "Amiri", serif;
      font-size: clamp(22px, 4.5vw, 36px);
      line-height: 2;
      text-align: center;
      color: #e9fff4;
      direction: rtl;
      text-shadow: 0 0 15px rgba(46,94,58,0.2);
      padding: 8px 0;
    }

    .verseDivider{
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(62,122,75,0.3), transparent);
      margin: 4px 0;
    }

    .tafsirSection{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .tafsirLabel{
      font-size: 11px;
      font-weight: 900;
      color: var(--moss2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .translationAr{
      font-family: "Amiri", serif;
      font-size: clamp(16px, 3vw, 20px);
      line-height: 1.8;
      text-align: right;
      color: rgba(234,242,238,0.85);
      direction: rtl;
    }
    .translationDarija{
      font-size: clamp(14px, 2.5vw, 17px);
      line-height: 1.6;
      text-align: right;
      color: rgba(234,242,238,0.6);
      direction: rtl;
      padding-top: 6px;
      border-top: 1px dashed rgba(255,255,255,0.08);
    }

    .memorizeVerseBtn{
      border: none;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      color: #e9fff4;
      background: linear-gradient(90deg, rgba(0,66,37,0.7), rgba(62,122,75,0.7));
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.2s;
      align-self: center;
    }
    .memorizeVerseBtn:active{ transform: scale(0.95); }
    .memorizeVerseBtn.done{
      background: linear-gradient(90deg, rgba(52,199,89,0.8), rgba(46,94,58,0.8));
    }

    /* ===== QURAN HUB MODAL ===== */
    #quranHub{
      position: fixed;
      inset: 0;
      background: rgba(11, 13, 14, 0.95);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }
    #quranHub.open{ display: flex; }
    .hubPanel{
      background: linear-gradient(180deg, #1a1d1b, #0f1412);
      border-radius: 24px;
      max-width: 800px;
      width: 95%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 30px;
      box-shadow: 0 0 100px rgba(37,99,235,0.2);
      border: 1px solid rgba(255,255,255,0.1);
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .hubHeader{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .hubTitle{ font-size: 24px; font-weight: 900; color: #d7f7e6; }
    .hubClose{ background: rgba(255,255,255,0.1); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer; transition: 0.2s; }
    .hubClose:hover{ background: rgba(255,255,255,0.2); }
    .hubGrid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .hubCard{
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hubCard:hover{
      background: rgba(37,99,235,0.15);
      border-color: var(--accent);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(37,99,235,0.2);
    }
    .hubCardName{ font-weight: 900; color: #EAF2EE; font-size: 16px; margin-bottom: 5px; font-family: "Amiri", serif; }
    .hubCardCount{ font-size: 11px; opacity: 0.6; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 20px; }
    .hubCardNumber{ font-size: 11px; opacity: 0.5; margin-top: 4px; }

    /* AirDrop */
    #airdrop-transfer-bar{
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: transparent;
      z-index: 99999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #airdrop-transfer-bar.active{ opacity: 1; }
    #airdrop-transfer-fill{
      height: 100%;
      width: 0%;
      background-color: var(--airdrop-blue);
      box-shadow: 0 0 10px var(--airdrop-blue);
      transition: width 0.3s ease-out, background-color 0.2s;
      position: relative;
    }
    #airdrop-transfer-bar.success #airdrop-transfer-fill{
      width: 100% !important;
      background-color: var(--airdrop-green);
      box-shadow: 0 0 15px var(--airdrop-green);
    }
    #airdrop-transfer-bar.success #airdrop-transfer-fill::after{
      content: '✓';
      position: absolute;
      right: 10px;
      top: -8px;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    @keyframes airdrop-pulse-anim {
      0% { box-shadow: 0 0 0 0 rgba(var(--airdrop-blue-rgb), 0.7); transform: scale(1); }
      50% { box-shadow: 0 0 0 15px rgba(var(--airdrop-blue-rgb), 0); transform: scale(1.05); }
      100% { box-shadow: 0 0 0 0 rgba(var(--airdrop-blue-rgb), 0); transform: scale(1); }
    }
    .airdrop-pulse { animation: airdrop-pulse-anim 0.6s ease-out; }

    /* Confetti */
    #confettiCanvas{ position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10002; }

    /* Scroll to top */
    .scrollToTop{
      position: fixed;
      bottom: 80px;
      right: 18px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0,66,37,0.8);
      border: 1px solid rgba(62,122,75,0.5);
      color: white;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 999;
      transition: 0.2s;
    }
    .scrollToTop:hover{ transform: scale(1.1); }
    .scrollToTop.visible{ display: flex; }

    /* WhatsApp */
    #waBtn{
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 54px;
      height: 54px;
      border-radius: 999px;
      background: var(--wa);
      border: none;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(0,0,0,0.35);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 9999;
    }
    #waBtn svg{ width: 28px; height: 28px; fill: #fff; }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>
  <div id="airdrop-transfer-bar"><div id="airdrop-transfer-fill"></div></div>

  <div id="app">
    <div class="topbar">
      <div class="brand">
        <div class="brandTitle">حفظ القرآن – تفسير السعدي</div>
        <div class="brandSub">تيسير الكريم الرحمن في تفسير كلام المنان</div>
      </div>
    </div>

    <div id="controls">
      <button class="btn btnVocab" id="quranBtn" type="button">📖 اختر سورة</button>
    </div>

    <div id="surahView" style="display:none;">
      <div class="surahHeader">
        <div class="surahTitle" id="surahTitle"></div>
        <div class="surahInfo" id="surahInfo"></div>
      </div>
      <div class="bismillah" id="bismillahDisplay" style="display:none;">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
      <div id="versesGrid"></div>
    </div>

    <div id="welcomeView" style="text-align:center; padding: 60px 20px;">
      <div style="font-family: 'Amiri Quran', serif; font-size: clamp(28px, 6vw, 48px); color: #d7f7e6; margin-bottom: 16px;">
        بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
      </div>
      <div style="font-size: 18px; color: var(--muted); line-height: 1.8; max-width: 500px; margin: 0 auto;">
        مرحبا بيك فبرنامج حفظ القرآن مع تفسير السعدي<br>
        اختار سورة من القائمة فوق باش تبدا
      </div>
    </div>
  </div>

  <button class="scrollToTop" id="scrollToTopBtn">↑</button>

  <!-- Quran Hub Modal -->
  <div id="quranHub">
    <div class="hubPanel">
      <div class="hubHeader">
        <div class="hubTitle">📖 القرآن الكريم</div>
        <button class="hubClose" id="closeQuranHub">×</button>
      </div>
      <div class="hubGrid" id="surahGridContainer"></div>
    </div>
  </div>

  <button id="waBtn" aria-label="WhatsApp">
    <svg viewBox="0 0 32 32">
      <path d="M19.11 17.25c-.27-.14-1.6-.79-1.85-.88-.25-.09-.43-.14-.62.14-.18.27-.71.88-.87 1.06-.16.18-.32.21-.59.07-.27-.14-1.16-.43-2.21-1.36-.82-.73-1.38-1.63-1.54-1.9-.16-.27-.02-.42.12-.56.12-.12.27-.32.41-.48.14-.16.18-.27.27-.46.09-.18.05-.34-.02-.48-.07-.14-.62-1.5-.85-2.06-.22-.53-.45-.46-.62-.47h-.53c-.18 0-.48.07-.73.34-.25.27-.96.94-.96 2.29 0 1.35.99 2.65 1.13 2.83.14.18 1.95 2.97 4.73 4.17.66.29 1.18.46 1.58.59.66.21 1.26.18 1.74.11.53-.08 1.6-.65 1.83-1.27.23-.62.23-1.15.16-1.27-.07-.12-.25-.18-.52-.32zM16 3C9.38 3 4 8.38 4 15c0 2.11.55 4.17 1.6 5.99L4 29l8.21-1.56A11.92 11.92 0 0 0 16 27c6.62 0 12-5.38 12-12S22.62 3 16 3zm0 21.7c-1.94 0-3.83-.52-5.47-1.5l-.39-.23-4.87.93.93-4.74-.25-.41A9.69 9.69 0 0 1 6.3 15C6.3 9.64 10.64 5.3 16 5.3S25.7 9.64 25.7 15 21.36 24.7 16 24.7z"/>
    </svg>
  </button>

  <script>
    // Protection
    document.addEventListener('contextmenu', e => e.preventDefault());

    // AirDrop helpers
    function hapticTap(ms = 10) { if (navigator.vibrate) navigator.vibrate(ms); }
    function flashPulse(el) {
      if (!el) return;
      el.classList.remove('airdrop-pulse');
      void el.offsetWidth;
      el.classList.add('airdrop-pulse');
    }
    function startTransferBar(durationMs = 1200) {
      const bar = document.getElementById('airdrop-transfer-bar');
      bar.classList.remove('success');
      const fill = document.getElementById('airdrop-transfer-fill');
      fill.style.width = '0%';
      fill.style.transition = 'none';
      bar.classList.add('active');
      requestAnimationFrame(() => {
        fill.style.transition = `width ${durationMs}ms ease-in-out`;
        fill.style.width = '100%';
      });
    }
    function endTransferBar() {
      const bar = document.getElementById('airdrop-transfer-bar');
      bar.classList.add('success');
      setTimeout(() => { bar.classList.remove('active', 'success'); }, 1400);
    }

    // Confetti
    function fireConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const particles = [];
      const colors = ['#007AFF', '#34C759', '#FFD60A', '#FF2D55', '#AF52DE'];
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: canvas.width / 2, y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 15,
          vy: (Math.random() - 0.5) * 15,
          size: Math.random() * 8 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 100
        });
      }
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
          if (p.life > 0) {
            active = true;
            p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
        });
        if (active) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    // =============================================
    // ✅ QURAN DATA - تفسير السعدي
    // =============================================
    const QURAN_DATA = {
      "الفاتحة": {
        number: 1,
        type: "مكية",
        ayahCount: 7,
        verses: [
          { num: 1, text: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", tafsir: "أبدأ قراءتي مستعينا بالله، مستمدا منه العون. الله: هو المألوه المعبود، المستحق للعبادة. الرحمن: ذو الرحمة الواسعة. الرحيم: ذو الرحمة الواصلة.", darija: "كنبدا قراءتي كنستعين بالله، كنطلب منو المعونة. الله: هو المعبود المستحق للعبادة. الرحمن: اللي عندو رحمة واسعة. الرحيم: اللي كيوصل الرحمة." },
          { num: 2, text: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", tafsir: "جميع أنواع الحمد والثناء لله وحده، فهو الخالق المالك المدبر لجميع المخلوقات من إنس وجن وملائكة وحيوان وغيرهم.", darija: "جميع أنواع الحمد والثناء لله وحده، هو الخالق المالك المدبر لجميع المخلوقات: الناس، الجن، الملائكة، الحيوانات وغيرهم." },
          { num: 3, text: "الرَّحْمَٰنِ الرَّحِيمِ", tafsir: "الرحمن: اسم من أسماء الله، يدل على أن الرحمة وصف له. الرحيم: اسم آخر يدل على أن الرحمة فعله، فيرحم خلقه بما يليق بهم.", darija: "الرحمن: اسم من أسماء الله، كيدل على أن الرحمة وصف ديالو. الرحيم: اسم آخر كيدل على أن الرحمة فعل ديالو، كيرحم خلقو بما يليق بيهم." },
          { num: 4, text: "مَالِكِ يَوْمِ الدِّينِ", tafsir: "هو المالك ليوم القيامة، يوم الحساب والجزاء. وفي هذا تحفيز للعاملين على العمل الصالح، وتحذير للمقصرين.", darija: "هو المالك ليوم القيامة، يوم الحساب والجزاء. وفي هاداش تحفيز للناس باش يخدمو الخير، وتحذير للمقصرين." },
          { num: 5, text: "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", tafsir: "إنا نخصك وحدك بالعبادة، ونطلب منك وحدك العون في جميع أمورنا. فالعبادة لله، والاستعانة بالله.", darija: "كنخصصك نتا وحدك بالعبادة، وكنطلبو منك نتا وحدك المعونة فجميع حوايجنا. فالعبادة لله، والاستعانة بالله." },
          { num: 6, text: "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ", tafsir: "دلنا وأرشدنا ووفقنا إلى الطريق المستقيم، وهو الإسلام الذي هو الطريق الواضح الذي لا اعوجاج فيه.", darija: "دلنا وأرشدنا ووفقنا للطريق المستقيم، وهو الإسلام اللي هو الطريق الواضح اللي ما فيهوش عوج." },
          { num: 7, text: "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ", tafsir: "طريق الذين أنعمت عليهم من النبيين والصديقين والشهداء والصالحين، لا طريق المغضوب عليهم كاليهود، ولا الضالين كالنصارى.", darija: "طريق اللي نعمت عليهم من الأنبياء والصديقين والشهداء والصالحين، ماشي طريق المغضوب عليهم كاليهود، ولا الضالين كالنصارى." }
        ]
      },
      "الإخلاص": {
        number: 112,
        type: "مكية",
        ayahCount: 4,
        verses: [
          { num: 1, text: "قُلْ هُوَ اللَّهُ أَحَدٌ", tafsir: "قل يا محمد: هو الله واحد أحد، لا شريك له، لا نظير ولا نظير له، فهو المتفرد بالكمال.", darija: "قل يا محمد: هو الله واحد أحد، ما عندوش شريك، ما كاين بحالو، هو المتفرد بالكمال." },
          { num: 2, text: "اللَّهُ الصَّمَدُ", tafsir: "الله هو السيد الذي يُقصد في الحوائج، جميع المخلوقات مفتقرة إليه وهو غني عنها.", darija: "الله هو السيد اللي كنقصدو فالحوایج، جميع المخلوقات محتاجة ليه وهو غني عنهم." },
          { num: 3, text: "لَمْ يَلِدْ وَلَمْ يُولَدْ", tafsir: "ليس له ولد ولا والد، فهو الغني عن ذلك، لكمال ذاته وصفاته.", darija: "ما عندو لا ولد ولا والد، هو غني عن هادشي، لكمال ذاته وصفاتو." },
          { num: 4, text: "وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ", tafsir: "وليس له مثيل ولا شبيه ولا نظير في ذاته وأسمائه وصفاته وأفعاله.", darija: "وما كاين حتى واحد بحالو لا فذاتو ولا فأسماو ولا فصفاتو ولا فأفعالو." }
        ]
      },
      "الفلق": {
        number: 113,
        type: "مكية",
        ayahCount: 5,
        verses: [
          { num: 1, text: "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ", tafsir: "قل يا محمد: أعتصم وألتجئ برب الفلق، وهو الصبح، لأن الله فالق الحب والنوى، وفالق الإصباح.", darija: "قل يا محمد: كنعتصم وكنلجأ برب الفلق، وهو الصبح، حيت الله فالق الحب والنوى، وفالق الإصباح." },
          { num: 2, text: "مِن شَرِّ مَا خَلَقَ", tafsir: "من شر جميع المخلوقات التي فيها شر، فإن الله خلق فيها الشر، فنستعيذ بربها من شرها.", darija: "من شر جميع المخلوقات اللي فيها شر، فإن الله خلق فيها الشر، كنستعيذو بربها من شرها." },
          { num: 3, text: "وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ", tafsir: "ومن شر الليل إذا أظلم واشتد ظلامه، فإن فيه شرورا كثيرة من الهوام والدواب وغيرها.", darija: "ومن شر الليل إلا ما أظلم واشتد ظلامو، حيت فيه شرور كثيرة من الهوام والدواب وغيرها." },
          { num: 4, text: "وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ", tafsir: "ومن شر الساحرات اللاتي ينفثن في عقد الخيط عند السحر، فإن السحر من أكبر الكبائر.", darija: "ومن شر الساحرات اللي كينفثو ف عقد الخيط وقت السحر، حيت السحر من أكبر الكبائر." },
          { num: 5, text: "وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ", tafsir: "ومن شر كل حاسد إذا دخل في الحسد وعمل مقتضاه، فإن الحسد يدفع صاحبه إلى الأذى والعدوان.", darija: "ومن شر كل حاسد إلا ما دخل فالحسد ودار مقتضاه، حيت الحسد كيدفع صاحبو للأذى والعدوان." }
        ]
      },
      "الناس": {
        number: 114,
        type: "مكية",
        ayahCount: 6,
        verses: [
          { num: 1, text: "قُلْ أَعُوذُ بِرَبِّ النَّاسِ", tafsir: "قل يا محمد: أعتصم وألتجئ برب الناس، وهو خالقهم ومالكهم ومدبر أمورهم.", darija: "قل يا محمد: كنعتصم وكنلجأ برب الناس، وهو خالقهم ومالكهم ومدبر أمورهم." },
          { num: 2, text: "مَلِكِ النَّاسِ", tafsir: "ملك الناس الذي له الملك التام عليهم، يتصرف فيهم بما يشاء.", darija: "ملك الناس اللي عندو الملك التام عليهم، كتصرف فيهم بما يشاء." },
          { num: 3, text: "إِلَٰهِ النَّاسِ", tafsir: "إله الناس الذي لا معبود بحق إلا هو، فالعبادة له وحده.", darija: "إله الناس اللي ما كاين معبود بحق إلا هو، فالعبادة ليه وحده." },
          { num: 4, text: "مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ", tafsir: "من شر الشيطان الذي يوسوس في صدور الناس، ثم إذا ذكر الله خنس وتأخر.", darija: "من شر الشيطان اللي كيوسوس فصدور الناس، ثم إلا ذكر الله خنس وتأخر." },
          { num: 5, text: "الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ", tafsir: "الذي يلقي الوسوسة في صدور الناس، فيزين لهم الشر ويصرفهم عن الخير.", darija: "اللي كيلقي الوسوسة فصدور الناس، كيزين ليهم الشر ويصرفهم على الخير." },
          { num: 6, text: "مِنَ الْجِنَّةِ وَالنَّاسِ", tafsir: "فإن شياطين الجن والإنس جميعا يوسوسون، فنستعيذ بالله من شرهم.", darija: "فإن شياطين الجن والإنس كاملين كيوسوسو، كنستعيذو بالله من شرهم." }
        ]
      },
      "الكوثر": {
        number: 108,
        type: "مكية",
        ayahCount: 3,
        verses: [
          { num: 1, text: "إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ", tafsir: "إنا أعطيناك يا محمد الخير الكثير في الدنيا والآخرة، ومن ذلك نهر الكوثر في الجنة.", darija: "إنا عطيناك يا محمد الخير الكثير فالدنيا والآخرة، ومن ذلك نهر الكوثر ف الجنة." },
          { num: 2, text: "فَصَلِّ لِرَبِّكَ وَانْحَرْ", tafsir: "فأخلص الصلاة والنحر لربك وحده، ولا تشرك به أحدا.", darija: "فأخلص الصلاة والنحر لربك وحده، وما تشرك بيه حتى واحد." },
          { num: 3, text: "إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ", tafsir: "إن مبغضك ومعاديك هو المقطوع من كل خير، لا ذكر له ولا أثر.", darija: "إن مبغضك ومعاديك هو المقطوع من كل خير، ما عندو لا ذكر ولا أثر." }
        ]
      },
      "العصر": {
        number: 103,
        type: "مكية",
        ayahCount: 3,
        verses: [
          { num: 1, text: "وَالْعَصْرِ", tafsir: "أقسم الله بالعصر، وهو الوقت الذي فيه أفعال العباد.", darija: "قسم الله بالعصر، وهو الوقت اللي فيه أفعال العباد." },
          { num: 2, text: "إِنَّ الْإِنسَانَ لَفِي خُسْرٍ", tafsir: "إن جنس الإنسان لفي نقصان وخسارة، بتصرف أوقاته فيما لا ينفعه.", darija: "إن جنس الإنسان لخاسر، كيضيع الوقت ديالو فمالي منفعتوش." },
          { num: 3, text: "إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ", tafsir: "إلا الذين آمنوا بالله وعملوا الأعمال الصالحة، وأوصى بعضهم بعضا بالتمسك بالحق والصبر على الأوامر والنواهي.", darija: "غير اللي آمنو بالله ودارو الأعمال الصالحة، ونصح بعضهم بعض بالتمسك بالحق والصبر على الأوامر والنواهي." }
        ]
      },
      "الفيل": {
        number: 105,
        type: "مكية",
        ayahCount: 5,
        verses: [
          { num: 1, text: "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ", tafsir: "ألم تعلم يا محمد كيف فعل ربك بأصحاب الفيل، أبرهة وجيشه الذين أرادوا هدم الكعبة؟", darija: "أما علمتي يا محمد كيفاش دار ربك بأصحاب الفيل، أبرهة وجيشو اللي بغاو يهدو الكعبة؟" },
          { num: 2, text: "أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ", tafsir: "ألم يجعل مكرهم وخداعهم في ضياع وإبطال؟", darija: "أما جعل مكرهم وخداعهم ف ضياع وإبطال؟" },
          { num: 3, text: "وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ", tafsir: "وأرسل عليهم طيرا جماعات متتابعة.", darija: "وسلط عليهم طير مجاميع متتابعة." },
          { num: 4, text: "تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ", tafsir: "ترميهم بحجارة من طين متحجر مكتوب.", darija: "كاترميهم بحجارة من طين متحجر." },
          { num: 5, text: "فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ", tafsir: "فجعلهم كهشيم الزرع الذي أكلته البهائم ثم داسته بأفواهها وأرجلها.", darija: "فجعلهم بحال هشيم الزرع اللي أكلاتو البهائم ثم داساتو بأفواهها وأرجلها." }
        ]
      },
      "قريش": {
        number: 106,
        type: "مكية",
        ayahCount: 4,
        verses: [
          { num: 1, text: "لِإِيلَافِ قُرَيْشٍ", tafsir: "من أجل أن ألف الله قريشا، وجمعهم على الرحلة في الشتاء إلى اليمن، وفي الصيف إلى الشام.", darija: "من أجل أن ألف الله قريش، وجمعهم على الرحلة فالشتاء لليمن، وفالصيف للشام." },
          { num: 2, text: "إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ", tafsir: "تألفهم وجمعهم على رحلتي الشتاء والصيف، اللتين كان ينتفعون بهما في تجارتهم.", darija: "تألفهم وجمعهم على رحلتي الشتاء والصيف، اللي كانو كينتفعو بيهم فالتجارة ديالهم." },
          { num: 3, text: "فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ", tafsir: "فليعبدوا شكرا له رب هذا البيت، الذي شرفهم ببنائه وجعلهم حراسه وخدمه.", darija: "خاصهم يخدمو شكرا ليه رب هاد البيت، اللي شرفهم ببنائه وجعلهم حراسو وخدمو." },
          { num: 4, text: "الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ", tafsir: "الذي أطعمهم من جوع وآمنهم من خوف، فإنهم كانوا في بلد لا زرع فيه ولا ثمر، لكن الله حفظهم بحرمه.", darija: "اللي أطعمهم من الجوع وآمنهم من الخوف، حيت كانو ف بلد ما كاين فيه لا زرع ولا ثمر، ولكن الله حفظهم بحرمو." }
        ]
      },
      "الماعون": {
        number: 107,
        type: "مكية",
        ayahCount: 7,
        verses: [
          { num: 1, text: "أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ", tafsir: "أخبرني عن الذي يكذب بيوم القيامة، فيعمل عملا يدل على تكذيبه.", darija: "خبرني على اللي كيكذب بيوم القيامة، كيدير عمل كيدل على تكذيبو." },
          { num: 2, text: "فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ", tafsir: "فذلك الذي يدفع اليتيم بعنف وشدة، ولا يحسن إليه.", darija: "هذاك هو اللي كيدفع اليتيم بعنف وشدة، وما كيحسنش ليه." },
          { num: 3, text: "وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ", tafsir: "ولا يحض غيره على إطعام المسكين، ولا يطعمه هو.", darija: "ولا كيحثش غيرو على إطعام المسكين، ولا كيأكلو هو." },
          { num: 4, text: "فَوَيْلٌ لِّلْمُصَلِّينَ", tafsir: "فويل وعذاب شديد للمصلين الذين هم في صلاتهم لاهون.", darija: "فويل وعذاب شديد للمصلين اللي كينساو فالصلاة ديالهم." },
          { num: 5, text: "الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ", tafsir: "الذين هم عن صلاتهم ساهون، لا يقيمونها على وجهها، ولا يحافظون على أوقاتها.", darija: "اللي كينساو فالصلاة ديالهم، ما كيديروهاش على وجهها، ولا كيحافظوش على أوقاتا." },
          { num: 6, text: "الَّذِينَ هُمْ يُرَاءُونَ", tafsir: "الذين هم يراءون الناس بأعمالهم، فيعملونها لأجل الناس لا لأجل الله.", darija: "اللي كيرياو الناس بأعمالهم، كيديروهم لأجل الناس ماشي لأجل الله." },
          { num: 7, text: "وَيَمْنَعُونَ الْمَاعُونَ", tafsir: "ويمنعون المعونة التي يجب بذلها للمحتاجين، من زكاة وإحسان.", darija: "وكيمنعو المعونة اللي خاص تبذل للمحتاجين، من زكاة وإحسان." }
        ]
      },
      "الكاثر": {
        number: 102,
        type: "مكية",
        ayahCount: 8,
        verses: [
          { num: 1, text: "أَلْهَاكُمُ التَّكَاثُرُ", tafsir: "أشغلكم التنافس في كثرة الأموال والأولاد والقبائل.", darija: "شغلكم التنافس ف كثرة الأموال والأولاد والقبائل." },
          { num: 2, text: "حَتَّىٰ زُرْتُمُ الْمَقَابِرَ", tafsir: "حتى زرتم المقابر، أي: حتى متم ودفنتم فيها.", darija: "حتى متو ودفنتو فيها." },
          { num: 3, text: "كَلَّا سَوْفَ تَعْلَمُونَ", tafsir: "كلا، ليس الأمر كما ظننتم، فسوف تعلمون عاقبة أمركم.", darija: "كلا، ماشي الأمر بحال ما ظنيتو، غادي تعلمو عاقبة أمركم." },
          { num: 4, text: "ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ", tafsir: "ثم كلا، فسوف تعلمون.", darija: "ثم كلا، غادي تعلمو." },
          { num: 5, text: "كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ", tafsir: "كلا، لو تعلمون علما يقينا لعلمتم ما أنتم عليه من الغرور.", darija: "كلا، لو تعلمو علما يقينا لغتعلمو اللي أنتم فيه من الغرور." },
          { num: 6, text: "لَتَرَوُنَّ الْجَحِيمَ", tafsir: "لترون الجحيم عين اليقين.", darija: "غادي تشوفو الجحيم." },
          { num: 7, text: "ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ", tafsir: "ثم لترونها رؤية اليقين.", darija: "ثم غادي تشوفوها رؤية اليقين." },
          { num: 8, text: "ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ", tafsir: "ثم لتسألن يومئذ عن النعيم: شكرتموه أم كفرتموه؟", darija: "ثم غادي تسالو يومئذ عن النعيم: شكرتوه أم كفرتوه؟" }
        ]
      },
      "الضحى": {
        number: 93,
        type: "مكية",
        ayahCount: 11,
        verses: [
          { num: 1, text: "وَالضُّحَىٰ", tafsir: "أقسم الله بالضحي، وهو الوقت الذي ترتفع فيه الشمس.", darija: "قسم الله بالضحي، وهو الوقت اللي كترتفع فيه الشمس." },
          { num: 2, text: "وَاللَّيْلِ إِذَا سَجَىٰ", tafsir: "والليل إذا سكن وأظلم.", darija: "والليل إلا سكن وأظلم." },
          { num: 3, text: "مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ", tafsir: "ما تركك ربك يا محمد وما أبغضك، بل أنت عنده محبوب.", darija: "ما تركك ربك يا محمد وما بغضك، بل نتا عندو محبوب." },
          { num: 4, text: "وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ", tafsir: "وللآخرة خير لك من الأولى، فإن ما أعد الله لك في الآخرة خير مما أعطاك في الدنيا.", darija: "والآخرة خير ليك من الأولى، حيت ما أعد الله ليك فالآخرة خير مما عطاكا فالدنيا." },
          { num: 5, text: "وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ", tafsir: "ولسوف يعطيك ربك حتى ترضى، فيعطيك من الثواب والكرامة حتى ترضى.", darija: "وغايعطيك ربك حتى ترضى، غايعطيك من الثواب والكرامة حتى ترضى." },
          { num: 6, text: "أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ", tafsir: "ألم يجدك يتيما فآواك؟ فإن الله آواك بجدك عبد المطلب ثم بعمك أبي طالب.", darija: "أما لقاك يتيم فآواك؟ فإن الله آواك بجدك عبد المطلب ثم بعمك أبي طالب." },
          { num: 7, text: "وَوَجَدَكَ ضَالًّا فَهَدَىٰ", tafsir: "ووجدك لا تعرف الكتاب ولا الإيمان فهداك للإسلام.", darija: "ولقاك ما كتعرفش الكتاب ولا الإيمان فهداك للإسلام." },
          { num: 8, text: "وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ", tafsir: "ووجدك فقيرا فأغناك الله بما أعطاك من الخير.", darija: "ولقاك فقير فأغناك الله بما عطاك من الخير." },
          { num: 9, text: "فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ", tafsir: "فأما اليتيم فلا تقهره، بل أحسن إليه كما أحسن الله إليك.", darija: "فأما اليتيم فلا تقهره، بل أحسن ليه بحال ما أحسن الله ليك." },
          { num: 10, text: "وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ", tafsir: "وأما السائل فلا تنهره، بل أعطه أو رده ردا جميلا.", darija: "وأما السائل فلا تنهره، بل عطيه أو رده ردا جميلا." },
          { num: 11, text: "وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ", tafsir: "وأما بنعمة ربك فحدث بها، وأظهرها عليك، واشكر الله عليها.", darija: "وأما بنعمة ربك فحدث بيها، وأظهرها عليك، واشكر الله عليها." }
        ]
      },
      "الشرح": {
        number: 94,
        type: "مكية",
        ayahCount: 8,
        verses: [
          { num: 1, text: "أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ", tafsir: "ألم نوسع لك صدرك بالهدى والإيمان، وننير قلبك بالمعرفة واليقين.", darija: "أما وسعنا ليك صدرك بالهدى والإيمان، ونورنا قلبك بالمعرفة واليقين." },
          { num: 2, text: "وَوَضَعْنَا عَنكَ وِزْرَكَ", tafsir: "وضعنا عنك ثقلك الذي كان يثقل ظهرك قبل النبوة.", darija: "حطينا عليك ثقلك اللي كان كيثقل ظهرك قبل النبوة." },
          { num: 3, text: "الَّذِي أَنقَضَ ظَهْرَكَ", tafsir: "الذي أنقض ظهرك وأضعف قوتك.", darija: "اللي كسر ظهرك وضعف قوتك." },
          { num: 4, text: "وَرَفَعْنَا لَكَ ذِكْرَكَ", tafsir: "ورفعنا لك ذكرك، فجعلناك مذكورا في الأرض والسماء.", darija: "ورفعنا ليك ذكرك، جعلناك مذكورا ف الأرض والسماء." },
          { num: 5, text: "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا", tafsir: "فإن مع العسر يسرا، فإن الله يجعل بعد الضيق فرجا.", darija: "فإن مع الصعوبة سهولة، فإن الله كيخلي بعد الضيق فرج." },
          { num: 6, text: "إِنَّ مَعَ الْعُسْرِ يُسْرًا", tafsir: "إن مع العسر يسرا، كررها تأكيدا.", darija: "إن مع الصعوبة سهولة، كررها تأكيدا." },
          { num: 7, text: "فَإِذَا فَرَغْتَ فَانصَبْ", tafsir: "فإذا فرغت من شئونك فانصب في العبادة.", darija: "إلا فرغتي من شؤونك فانصب ف العبادة." },
          { num: 8, text: "وَإِلَىٰ رَبِّكَ فَارْغَب", tafsir: "وإلى ربك فارغب، أي: اطلب من ربك كل خير.", darija: "ولربك فارغب، أي: طلب من ربك كل خير." }
        ]
      },
      "التين": {
        number: 95,
        type: "مكية",
        ayahCount: 8,
        verses: [
          { num: 1, text: "وَالتِّينِ وَالزَّيْتُونِ", tafsir: "أقسم الله بالتين والزيتون، وهما من أطيب الفواكه وأنفعها.", darija: "قسم الله بالتين والزيتون، وهم من أطيب الفواكه وأنفعهم." },
          { num: 2, text: "وَطُورِ سِينِينَ", tafsir: "وبطور سينين، وهو الجبل الذي كلم الله عليه موسى.", darija: "وبطور سينين، وهو الجبل اللي كلم الله عليه موسى." },
          { num: 3, text: "وَهَٰذَا الْبَلَدِ الْأَمِينِ", tafsir: "وهذا البلد الأمين، وهو مكة.", darija: "وهاد البلد الأمين، وهو مكة." },
          { num: 4, text: "لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ", tafsir: "لقد خلقنا الإنسان في أحسن صورة وأكملها.", darija: "لقد خلقنا الإنسان ف أحسن صورة وأكملها." },
          { num: 5, text: "ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ", tafsir: "ثم رددناه أسفل سافلين، أي: إلى النار إن لم يعمل بالطاعة.", darija: "ثم رددناه أسفل سافلين، أي: للنار إلا ما خدم بالطاعة." },
          { num: 6, text: "إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ", tafsir: "إلا الذين آمنوا وعملوا الصالحات فلهم أجر غير ممنون، أي: غير مقطوع.", darija: "غير اللي آمنو ودارو الصالحات فلهم أجر غير مقطوع." },
          { num: 7, text: "فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ", tafsir: "فما يكذبك بعد بالدين، أي: فما يحملك على التكذيب بيوم الدين؟", darija: "فشنو كيحملك على التكذيب بيوم الدين؟" },
          { num: 8, text: "أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ", tafsir: "أليس الله بأحكم الحاكمين؟ بلى، فهو أحكم الحاكمين، يحكم بين عباده يوم القيامة.", darija: "أليس الله بأحكم الحاكمين؟ بلى، هو أحكم الحاكمين، كيحكم بين عباده يوم القيامة." }
        ]
      },
      "القدر": {
        number: 97,
        type: "مكية",
        ayahCount: 5,
        verses: [
          { num: 1, text: "إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ", tafsir: "إنا أنزلنا القرآن في ليلة القدر، وهي ليلة مباركة.", darija: "إنا نزلنا القرآن ف ليلة القدر، وهي ليلة مباركة." },
          { num: 2, text: "وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ", tafsir: "وما أدراك ما ليلة القدر؟ تعظيم لشأنها.", darija: "وأش عرفك شنو ليلة القدر؟ تعظيم لشأنها." },
          { num: 3, text: "لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ", tafsir: "ليلة القدر خير من ألف شهر، أي: العمل فيها خير من العمل في ألف شهر.", darija: "ليلة القدر خير من ألف شهر، أي: العمل فيها خير من العمل ف ألف شهر." },
          { num: 4, text: "تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ", tafsir: "تنزل الملائكة والروح فيها بإذن ربهم، من كل أمر، أي: بأمر الله.", darija: "كتنزل الملائكة والروح فيها بإذن ربهم، بأمر الله." },
          { num: 5, text: "سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ", tafsir: "سلام هي حتى مطلع الفجر، أي: هي سلام كلها من أولها إلى آخرها.", darija: "سلام هي حتى مطلع الفجر، أي: هي سلام كلها من أولها إلى آخرها." }
        ]
      },
      "الزلزلة": {
        number: 99,
        type: "مدنية",
        ayahCount: 8,
        verses: [
          { num: 1, text: "إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا", tafsir: "إذا زلزلت الأرض زلزالها الشديد يوم القيامة.", darija: "إلا زلزمات الأرض زلزالها الشديد يوم القيامة." },
          { num: 2, text: "وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا", tafsir: "وأخرجت الأرض أثقالها، أي: ما في بطنها من الموتى والكنوز.", darija: "وأخرجت الأرض أثقالها، أي: ما ف بطنها من الموتى والكنوز." },
          { num: 3, text: "وَقَالَ الْإِنسَانُ مَا لَهَا", tafsir: "وقال الإنسان: ما لها؟ متعجبا من حالها.", darija: "وقال الإنسان: ما لها؟ متعجبا من حالها." },
          { num: 4, text: "يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا", tafsir: "يومئذ تحدث أخبارها، أي: تخبر بما عمل عليها العباد.", darija: "يومئذ كتحدث أخبارها، أي: كتخبر بما خدم عليها العباد." },
          { num: 5, text: "بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا", tafsir: "بأن ربك أوحى لها، أي: أمرها بأن تخبر.", darija: "بأن ربك أوحى ليها، أي: أمرها بأن تخبر." },
          { num: 6, text: "يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ", tafsir: "يومئذ يصدر الناس أشتاتا، أي: متفرقين، ليروا أعمالهم.", darija: "يومئذ كيخرجو الناس متفرقين، باش يشوفو أعمالهم." },
          { num: 7, text: "فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ", tafsir: "فمن يعمل مثقال ذرة خيرا يره، أي: من يعمل وزن نملة خيرا يره.", darija: "فمن يدير وزن نملة خير يشوفو." },
          { num: 8, text: "وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ", tafsir: "ومن يعمل مثقال ذرة شرا يره.", darija: "ومن يدير وزن نملة شر يشوفو." }
        ]
      },
      "العاديات": {
        number: 100,
        type: "مكية",
        ayahCount: 11,
        verses: [
          { num: 1, text: "وَالْعَادِيَاتِ ضَبْحًا", tafsir: "أقسم الله بالخيل العدوات التي تعدو في سبيل الله وتضبح، أي: تلهث من سرعة عدوها.", darija: "قسم الله بالخيل اللي كتعدو ف سبيل الله وتلهث من سرعة عدوها." },
          { num: 2, text: "فَالْمُورِيَاتِ قَدْحًا", tafsir: "فالموريات نارا بحوافرها عند عدوها.", darija: "اللي كتوري نارا بحوافرها وقت عدوها." },
          { num: 3, text: "فَالْمُغِيرَاتِ صُبْحًا", tafsir: "فالمغيرات على الأعداء صباحا.", darija: "اللي كيهجمو على الأعداء صباحا." },
          { num: 4, text: "فَأَثَرْنَ بِهِ نَقْعًا", tafsir: "فأثرن بغبار عدوها.", darija: "فأثرن بغبار عدوها." },
          { num: 5, text: "فَوَسَطْنَ بِهِ جَمْعًا", tafsir: "فوسطن بجمع الأعداء.", darija: "فوسطن بجمع الأعداء." },
          { num: 6, text: "إِنَّ الْإِنسَانَ لِرَبِّهِ لَكَنُودٌ", tafsir: "إن الإنسان لربه لكنود، أي: لكفور.", darija: "إن الإنسان لربه لكنود، أي: لكفور." },
          { num: 7, text: "وَإِنَّهُ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ", tafsir: "وإنه على ذلك لشهيد، أي: لشاهد على نفسه بالكفر.", darija: "وإنه على ذلك لشهيد، أي: لشاهد على نفسو بالكفر." },
          { num: 8, text: "وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ", tafsir: "وإنه لحب المال لشديد.", darija: "وإنه لحب المال لشديد." },
          { num: 9, text: "أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ", tafsir: "أفلا يعلم إذا بعثر ما في القبور، أي: أخرج الموتى منها.", darija: "أفما يعلم إلا ما بعثر ما ف القبور، أي: أخرج الموتى منها." },
          { num: 10, text: "وَحُصِّلَ مَا فِي الصُّدُورِ", tafsir: "وحصل ما في الصدور، أي: أخرج ما في الصدور من الأسرار.", darija: "وأخرج ما ف الصدور من الأسرار." },
          { num: 11, text: "إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌ", tafsir: "إن ربهم بهم يومئذ لخبير، أي: عليم بأحوالهم.", darija: "إن ربهم بيهم يومئذ لخبير، أي: عليم بأحوالهم." }
        ]
      },
      "الهمزة": {

          { num: 1, text: "وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ", tafsir: "ويل لكل همزة لمزة، أي: عذاب شديد لكل عياب للناس وطعان فيهم.", darija: "ويل وعذاب شديد لكل عياب للناس وطعان فيهم." },
          { num: 2, text: "الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ", tafsir: "الذي جمع مالا كثيرا وعدده، وظن أنه يغنيه.", darija: "اللي جمع مال كثير وعددو، وظن أنه غاينفعو." },
          { num: 3, text: "يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ", tafsir: "يظن أن ماله أخلده في الدنيا، وأن المال يدفع عنه الموت.", darija: "كيحسب أن مالو غادي يخليه خالد فالدنيا، وأن المال غادي يدفع عنو الموت." },
          { num: 4, text: "كَلَّا ۖ لَيُنبَذَنَّ فِي الْحُطَمَةِ", tafsir: "كلا، ليس الأمر كما ظن، بل ليطرحن في الحطمة، وهي النار.", darija: "كلا، ماشي الأمر بحال ما ظن، بل غادي يتطرح فالحطمة، وهي النار." },
          { num: 5, text: "وَمَا أَدْرَاكَ مَا الْحُطَمَةُ", tafsir: "وما أدراك ما الحطمة؟ تعظيم لشأنها.", darija: "وأش عرفك شنو الحطمة؟ تعظيم لشأنها." },
          { num: 6, text: "نَارُ اللَّهِ الْمُوقَدَةُ", tafsir: "هي نار الله الموقدة التي لا تنطفئ.", darija: "هي نار الله الموقدة اللي ما كتطفيش." },
          { num: 7, text: "الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ", tafsir: "التي تطلع على القلوب فتصل إليها.", darija: "اللي كتطلع على القلوب كتوصل ليها." },
          { num: 8, text: "إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ", tafsir: "إنها عليهم مغلقة، لا يخرجون منها.", darija: "إنها عليهم مغلقة، ما كيخرجو منها." },
          { num: 9, text: "فِي عَمَدٍ مُّمَدَّدَةٍ", tafsir: "في أعمدة ممددة طويلة، لا يعلم مداها إلا الله.", darija: "ف أعمدة ممددة طويلة، ما كيعل مداها إلا الله." }
        ]
      }
    };

    // =============================================
    // ✅ APP STATE
    // =============================================
    let currentSurah = null;
    let memorizedVerses = {};

    function loadState() {
      try {
        const saved = localStorage.getItem('quran_memorized_sadi');
        if (saved) memorizedVerses = JSON.parse(saved);
        const lastSurah = localStorage.getItem('quran_last_surah_sadi');
        if (lastSurah && QURAN_DATA[lastSurah]) {
          currentSurah = lastSurah;
        }
      } catch(e) {}
    }

    function saveState() {
      localStorage.setItem('quran_memorized_sadi', JSON.stringify(memorizedVerses));
      if (currentSurah) {
        localStorage.setItem('quran_last_surah_sadi', currentSurah);
      }
    }

    // =============================================
    // ✅ RENDER FUNCTIONS
    // =============================================
    function renderSurahView() {
      if (!currentSurah || !QURAN_DATA[currentSurah]) return;

      const surah = QURAN_DATA[currentSurah];
      
      document.getElementById('surahTitle').textContent = `سورة ${currentSurah}`;
      document.getElementById('surahInfo').textContent = `${surah.type} • ${surah.ayahCount} آيات`;

      // Bismillah
      const bismillah = document.getElementById('bismillahDisplay');
      if (surah.number !== 1 && surah.number !== 9) {
        bismillah.style.display = 'block';
      } else {
        bismillah.style.display = 'none';
      }

      // Verses
      const grid = document.getElementById('versesGrid');
      grid.innerHTML = '';

      surah.verses.forEach((verse, index) => {
        const key = `${currentSurah}_${verse.num}`;
        const isMemorized = memorizedVerses[key];

        const card = document.createElement('div');
        card.className = 'verseCard' + (isMemorized ? ' memorized' : '');
        card.id = `verse-${verse.num}`;

        card.innerHTML = `
          <div class="verseTopRow">
            <div class="verseNum">${verse.num}</div>
            <div class="verseActions">
              <button class="verseActionBtn speak-btn" data-verse="${verse.num}" title="استمع">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              </button>
            </div>
          </div>
          <div class="arabicText">${verse.text}</div>
          <div class="verseDivider"></div>
          <div class="tafsirSection">
            <div class="tafsirLabel">تفسير السعدي</div>
            <div class="translationAr">${verse.tafsir}</div>
            <div class="translationDarija">${verse.darija}</div>
          </div>
          <button class="memorizeVerseBtn ${isMemorized ? 'done' : ''}" data-verse="${verse.num}">
            ${isMemorized ? '✓ تم الحفظ' : '✓ حفظت هذه الآية'}
          </button>
        `;

        grid.appendChild(card);
      });

      // Add event listeners
      grid.querySelectorAll('.speak-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          hapticTap(10);
          const verseNum = parseInt(btn.dataset.verse);
          const verse = surah.verses.find(v => v.num === verseNum);
          if (verse) speakArabic(verse.text, { rate: 0.8 });
        };
      });

      grid.querySelectorAll('.memorizeVerseBtn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          hapticTap([10, 30, 10]);
          const verseNum = parseInt(btn.dataset.verse);
          const key = `${currentSurah}_${verseNum}`;
          
          if (memorizedVerses[key]) {
            delete memorizedVerses[key];
          } else {
            memorizedVerses[key] = true;
            // Check if all verses memorized
            const allDone = surah.verses.every(v => memorizedVerses[`${currentSurah}_${v.num}`]);
            if (allDone) {
              fireConfetti();
            }
          }
          
          saveState();
          renderSurahView();
        };
      });

      // Show surah view, hide welcome
      document.getElementById('surahView').style.display = 'block';
      document.getElementById('welcomeView').style.display = 'none';
    }

    function renderSurahGrid() {
      const container = document.getElementById('surahGridContainer');
      container.innerHTML = '';

      // Sort surahs by number (reverse for RTL display)
      const sortedSurahs = Object.keys(QURAN_DATA).sort((a, b) => QURAN_DATA[b].number - QURAN_DATA[a].number);

      sortedSurahs.forEach(surahName => {
        const surah = QURAN_DATA[surahName];
        const card = document.createElement('div');
        card.className = 'hubCard';

        // Count memorized
        let memCount = 0;
        surah.verses.forEach(v => {
          if (memorizedVerses[`${surahName}_${v.num}`]) memCount++;
        });

        const progress = Math.round((memCount / surah.ayahCount) * 100);

        card.innerHTML = `
          <div class="hubCardName">${surahName}</div>
          <div class="hubCardCount">${surah.ayahCount} آيات</div>
          <div class="hubCardNumber">${memCount}/${surah.ayahCount} • ${progress}%</div>
        `;

        card.onclick = () => {
          hapticTap(15);
          flashPulse(card);
          startTransferBar(600);

          currentSurah = surahName;
          renderSurahView();
          document.getElementById('quranHub').classList.remove('open');
          endTransferBar();
          saveState();

          // Scroll to top
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        container.appendChild(card);
      });
    }

    // =============================================
    // ✅ SPEECH (Arabic TTS)
    // =============================================
    const TTS = {
      voices: [],
      ready: false,
      isIOS: /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream,
    };

    function ttsRefreshVoices() {
      if (!window.speechSynthesis) return;
      TTS.voices = window.speechSynthesis.getVoices() || [];
      TTS.ready = TTS.voices.length > 0;
    }
    if (window.speechSynthesis) {
      ttsRefreshVoices();
      window.speechSynthesis.onvoiceschanged = ttsRefreshVoices;
    }

    function pickBestArabicVoice() {
      const voices = TTS.voices || [];
      if (!voices.length) return null;

      const arabic = voices.filter(v => {
        const lang = (v.lang || '').toLowerCase();
        return lang.startsWith('ar');
      });
      if (!arabic.length) return null;

      arabic.sort((a, b) => {
        const scoreA = scoreArVoice(a);
        const scoreB = scoreArVoice(b);
        return scoreB - scoreA;
      });
      return arabic[0];
    }

    function scoreArVoice(v) {
      const lang = (v.lang || '').toLowerCase();
      const name = (v.name || '').toLowerCase();
      let s = 0;
      if (lang === 'ar-sa') s += 50;
      else if (lang.startsWith('ar')) s += 40;
      if (v.localService) s += 8;
      if (name.includes('google')) s += 20;
      if (name.includes('enhanced')) s += 10;
      if (name.includes('premium')) s += 10;
      if (name.includes('neural')) s += 10;
      return s;
    }

    function speakArabic(text, opts = {}) {
      const t = String(text || '').trim();
      if (!t || !window.speechSynthesis) return;

      try { window.speechSynthesis.cancel(); } catch(e) {}
      ttsRefreshVoices();

      const voice = pickBestArabicVoice();
      const rate = opts.rate || 0.85;
      const pitch = opts.pitch || 1.0;

      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'ar-SA';
      u.rate = rate;
      u.pitch = pitch;
      u.volume = 1;
      if (voice) u.voice = voice;

      if (TTS.isIOS) {
        try { window.speechSynthesis.resume(); } catch(e) {}
        setTimeout(() => { try { window.speechSynthesis.speak(u); } catch(e) {} }, 80);
      } else {
        requestAnimationFrame(() => window.speechSynthesis.speak(u));
      }
    }

    // =============================================
    // ✅ EVENT LISTENERS
    // =============================================
    document.getElementById('quranBtn').onclick = () => {
      hapticTap(15);
      startTransferBar(600);
      renderSurahGrid();
      document.getElementById('quranHub').classList.add('open');
      endTransferBar();
    };

    document.getElementById('closeQuranHub').onclick = () => {
      hapticTap(10);
      document.getElementById('quranHub').classList.remove('open');
    };

    document.getElementById('quranHub').onclick = (e) => {
      if (e.target.id === 'quranHub') document.getElementById('quranHub').classList.remove('open');
    };

    // Scroll to top button
    const scrollBtn = document.getElementById('scrollToTopBtn');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        scrollBtn.classList.add('visible');
      } else {
        scrollBtn.classList.remove('visible');
      }
    });
    scrollBtn.onclick = () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // WhatsApp
    document.getElementById('waBtn').onclick = () => {
      window.open(`https://wa.me/212602396497?text=${encodeURIComponent('السلام عليكم!')}`, '_blank');
    };

    // =============================================
    // ✅ INIT
    // =============================================
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      if (currentSurah && QURAN_DATA[currentSurah]) {
        renderSurahView();
      }
    });
  </script>
</body>
</html>
